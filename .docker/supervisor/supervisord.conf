[supervisord]
nodaemon=false
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfil=/www/storage/logs/supervisor/supervisord.pid
loglevel=info

[program:octane]
process_name=%(program_name)s_%(process_num)02d
command=php -d memory_limit=64M -d opcache.enable=0 /www/artisan octane:start --host=0.0.0.0 --port=7001 --max-requests=64 --workers=1 --task-workers=1
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
numprocs=1
stopwaitsecs=10
stopsignal=QUIT
stopasgroup=true
killasgroup=true
priority=100

[program:redis]
process_name=%(program_name)s_%(process_num)02d
command=redis-server --dir /data --dbfilename dump.rdb --save "" --maxmemory 64mb --maxmemory-policy allkeys-lru --unixsocket /data/redis.sock --unixsocketperm 777 --port 0
autostart=false
autorestart=true
user=redis
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
numprocs=1
stopwaitsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=300 
